name: Build and Deploy GradePulse APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Generate debug keystore for Firebase Sign-In compatibility
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare GitHub Pages site bundle
        run: |
          mkdir -p site
          cp app/build/outputs/apk/debug/app-debug.apk site/GradePulse-WinnersFamilySchool.apk
          cp app/build/outputs/apk/debug/app-debug.apk site/GradeSubmit.apk
          cp .github/pages/index.html site/index.html

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GradeSubmit-apk
          path: site/GradeSubmit.apk

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish direct APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Clean release assets so no stale/conflicting APKs remain
          gh release delete-asset latest app-debug.apk --yes 2>/dev/null || true
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "GradeSubmit v1.9 — Winners Family School" --notes "Fresh v1.9 build (commit ${{ github.sha }}). Folder file sends now include a minimal default text caption when none is entered so WhatsApp opens the parent's chat directly instead of the contact picker. Download GradeSubmit.apk."
            gh release upload latest site/GradeSubmit.apk --clobber
          else
            gh release create latest site/GradeSubmit.apk \
              --target "${{ github.sha }}" \
              --title "GradeSubmit v1.9 — Winners Family School" \
              --notes "Fresh v1.9 build (commit ${{ github.sha }}). Folder file sends now include a minimal default text caption when none is entered so WhatsApp opens the parent's chat directly instead of the contact picker. Download GradeSubmit.apk."
          fi

  deploy_pages:
    name: Deploy Install Page to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
